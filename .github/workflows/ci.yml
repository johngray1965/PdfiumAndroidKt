name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Critical for git-sensitive-semantic-versioning

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13846066"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Build + test on every push / PR. Releasing (Maven Central + GitHub
      # release + AAR assets) is owned end-to-end by release.sh, not here.
      - name: Build & Test
        run: ./gradlew :pdfiumandroid:check :pdfiumandroid:api:check :pdfiumandroid:core:check :pdfiumandroid:arrow:check